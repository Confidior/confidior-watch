[project]
name = "confidior-watch"
version = "0.1.0"
description = "A continuity log for published attestation evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=48.0.0",
    "cvm-attest>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures carry full hashes, PEM blobs and base64 bodies. They cannot be
# wrapped without changing the value under test.
"tests/*" = ["E501"]

[tool.ruff.format]
# Frozen copy of the engine's anchoring path. Reformatting it silently would be
# the one change its own docstring warns against, so it is left byte-exact.
exclude = ["watch/rekor_vendored.py"]

[tool.mypy]
python_version = "3.10"
files = ["watch"]
# The verifiers are imported at call time behind try/except, and this repo must
# typecheck without them: src.* is the engine's own package, cvm_attest ships no
# py.typed marker, and sev_pytools is an optional dependency for the AMD path.
[[tool.mypy.overrides]]
module = ["src.*", "cvm_attest.*", "sev_pytools.*"]
ignore_missing_imports = true
