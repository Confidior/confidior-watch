name: CI

# The observe workflow runs the suite once a week before it crawls. This one
# runs on every push and pull request, so a change is checked before it is
# merged rather than up to seven days afterwards.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check watch/ tests/

      - name: Check formatting
        run: uv run ruff format --check watch/ tests/

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest tests/ -q

  # The declared floor is 3.10. datetime.UTC is 3.11+, and a check-only CI on a
  # single version would not have caught it, so the suite runs on the floor and
  # the newest version the workflow uses.
  test-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Test on Python ${{ matrix.python-version }}
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -q
