name: Continuity log

# Records what vendors publish about their own attestation evidence, weekly.
#
# Why weekly rather than daily: measurement changes are rare events, so weekly
# loses almost nothing, and a weekly cadence costs five times less adapter rot.
#
# Self-sustaining: GitHub disables scheduled workflows after 60 days without
# repository activity. This job commits every run, which counts as activity, so
# the schedule outlives a repository that would otherwise go quiet.

on:
  schedule:
    # Mondays at 06:17 UTC. Off the hour: the shared runners are busy on :00.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # to commit the observation log
  issues: write     # to open an issue on itself after repeated source failure

concurrency:
  group: continuity-log
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      # The wire check offers the PQ hybrid groups (X25519MLKEM768 and friends)
      # to see what each endpoint negotiates. OpenSSL added those groups in 3.5;
      # the image ships 3.0, where passing them to -groups fails before the
      # connection is made, so every observation records 'group not reported'
      # and the column silently holds nothing. Build 3.5 from source.
      #
      # Not cached, and deliberately not fatal-if-skipped: if the build fails the
      # run continues, but it must not do so quietly, because the fallback is the
      # defect this step exists to fix. The version is printed before and after.
      - name: Install OpenSSL with the PQ groups
        run: |
          set -euo pipefail
          echo "image openssl: $(openssl version)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential perl
          curl -sSLf https://github.com/openssl/openssl/releases/download/openssl-3.5.1/openssl-3.5.1.tar.gz -o /tmp/openssl.tar.gz
          tar -xzf /tmp/openssl.tar.gz -C /tmp
          cd /tmp/openssl-3.5.1
          ./Configure --prefix=/usr/local/openssl35 --libdir=lib
          make -j"$(nproc)"
          sudo make install_sw
          echo "built openssl: $(/usr/local/openssl35/bin/openssl version)"

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest tests/ -q

      - name: Observe
        id: observe
        run: |
          PATH="/usr/local/openssl35/bin:$PATH" \
          uv run python -m watch.collector --log observations.jsonl --anchors anchors.jsonl --anchor
          openssl version

      - name: Detect sources that returned nothing usable
        id: check
        run: |
          python - <<'PY'
          import json, os, pathlib
          log = pathlib.Path("observations.jsonl")
          lines = [json.loads(l) for l in log.read_text().splitlines() if l.strip()]
          today = lines[-1]["observed_at"][:10]
          todays = [l for l in lines if l["observed_at"][:10] == today and l["vendor"] != "__heartbeat__"]
          ok = [l for l in todays if l["http_status"] == 200 and (l["measurement"] or l["keyset_digest"])]
          healthy = len(ok) > 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"healthy={'true' if healthy else 'false'}\n")
              f.write(f"ok_count={len(ok)}\n")
              f.write(f"total={len(todays)}\n")
          print(f"usable observations: {len(ok)}/{len(todays)}")
          PY

      # Failures surface themselves rather than requiring the owner to poll.
      # One bad week is normal (a vendor is redeploying). Only open an issue when
      # *no* source returned usable evidence, which means the job is broken or
      # every source has moved -- both need a human.
      - name: Open an issue if nothing was readable
        if: steps.check.outputs.healthy == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Continuity log: no source returned usable evidence`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'source-rot',
            });
            if (existing.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Still failing on ${new Date().toISOString().slice(0,10)}. ` +
                      `Usable observations: ${{ steps.check.outputs.ok_count }}/${{ steps.check.outputs.total }}.`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['source-rot'],
              body: [
                'The scheduled crawl ran but **no source returned usable evidence**.',
                '',
                'A gap in the timeline is itself a finding, and this issue is that gap',
                'made visible. Likely causes: a source moved, changed shape, or began',
                'requiring authentication.',
                '',
                'The observation with its HTTP status is still in `observations.jsonl` —',
                'the log records the failure rather than hiding it. Check the latest',
                '`__heartbeat__` line to confirm the job ran at all.',
                '',
                `Usable: ${{ steps.check.outputs.ok_count }}/${{ steps.check.outputs.total }}`,
              ].join('\n'),
            });

      - name: Commit the observation
        run: |
          git config user.name  "confidior-watch"
          git config user.email "watch@users.noreply.github.com"
          git add observations.jsonl anchors.jsonl
          if git diff --staged --quiet; then
            echo "No change recorded this run (the log is append-only, so this means nothing was written)."
            exit 0
          fi
          git commit -m "observe: $(date -u +%Y-%m-%d)"
          git push
